name: Sync stores

# Runs the fully-automated sync scripts (no AI/vision needed — pure
# scraping/parsing of each store's own product API) on a schedule, so the
# catalog refreshes itself instead of needing a manual `python sync_*.py`
# run. The Facebook-post stores (EsLam Nasser, Mostafa Mohamed, Hossam
# ElDeen Gamal, Mohamed Mohie) are NOT included here — those need a
# specific new post URL and a vision model each time, so they stay manual.
#
# Setup (one-time):
#   1. Push this file to the repo (Settings > Actions doesn't need to be
#      touched for the workflow to appear, but the next step does).
#   2. Settings > Actions > General > Workflow permissions > select
#      "Read and write permissions" and save. Without this the final
#      `git push` step fails with a 403.
#   3. That's it — it'll run on the schedule below, and you can also
#      trigger it manually any time from the Actions tab ("Run workflow").

on:
  schedule:
    - cron: "0 */2 * * *"  # every 2 hours — adjust as you like
  workflow_dispatch: {}   # lets you click "Run workflow" in the Actions tab on demand

permissions:
  contents: write

# A run can take a while (image downloads across ~7 stores) — if one is
# still going when the next 2-hour trigger fires, this cancels the
# earlier, still-running one rather than letting both try to commit/push
# at once (which would just make the second one's push fail on a
# non-fast-forward and waste the whole run).
concurrency:
  group: sync-stores
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Each script commits locally on its own (matches how these are run
      # manually) — continue-on-error so one store having a bad day (site
      # redesign, timeout) doesn't block the others from still syncing.
      - name: Sync roseperfume
        continue-on-error: true
        run: python sync_roseperfume.py

      - name: Sync sniffz
        continue-on-error: true
        run: python sync_sniffz.py

      - name: Sync MO Shawky
        continue-on-error: true
        run: python sync_mo_shawky.py

      - name: Sync eldesoki-fragrances
        continue-on-error: true
        run: python sync_eldesoki.py

      - name: Sync emaratiscents
        continue-on-error: true
        run: python sync_emaratiscents.py

      - name: Sync dar.elarabia
        continue-on-error: true
        run: python sync_darelarabia.py

      - name: Sync perfuzone
        continue-on-error: true
        run: python sync_perfuzone.py

      - name: Sync og-perfume
        continue-on-error: true
        run: python sync_og_perfume.py

      - name: Sync feel22
        continue-on-error: true
        run: python sync_feel22.py

      - name: Sync mazaya
        continue-on-error: true
        run: python sync_mazaya.py

      # Regenerate per-product share/SEO pages here too, not just in the
      # separate generate-product-pages.yml workflow — a push made with
      # this job's own GITHUB_TOKEN (which `git push` below uses via
      # actions/checkout's persisted credentials) does NOT trigger other
      # workflows' `push` events, by GitHub's own loop-prevention design.
      # generate-product-pages.yml's push trigger still covers the other
      # products.json update paths (admin.html commits straight via the
      # GitHub API with a real PAT, manual pushes) — this step exists
      # specifically so the scheduled path isn't silently skipped.
      - name: Regenerate product pages
        continue-on-error: true
        run: python generate_product_pages.py

      # A plain `git push` here would fail outright on a non-fast-forward
      # if ANYTHING else landed on main during this run's ~15-20 minutes
      # of sequential syncing (a manual push from an interactive session,
      # admin.html's direct-API commits, generate-product-pages.yml) --
      # confirmed happening in practice, losing that whole run's synced
      # work since the job just ends after the rejected push. Rebase onto
      # whatever's on origin and retry a few times instead; a real content
      # conflict (rare -- this job only ever touches products.json/
      # images/products/, which nothing else edits at the same structural
      # spot in the normal course of things) aborts the rebase and moves
      # on to the next attempt rather than leaving the runner mid-rebase.
      - name: Push commits
        run: |
          set +e
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if [ $? -ne 0 ]; then
              git rebase --abort
              echo "Rebase failed on attempt $i, retrying..."
              sleep $((RANDOM % 10 + 5))
              continue
            fi
            git push origin main
            if [ $? -eq 0 ]; then
              echo "Pushed successfully on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed (remote moved), retrying..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "::error::Failed to push after 5 attempts -- remote kept moving."
          exit 1

      # find_duplicates.py never changes anything — it only flags near-
      # duplicate candidates worth a manual look (a brand-suffix/naming
      # difference that legitimately didn't auto-merge). Shown right in
      # the run summary so a check-in doesn't require reading raw logs.
      - name: Report possible duplicates
        if: always()
        run: |
          echo "## Possible duplicate products" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python find_duplicates.py >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
