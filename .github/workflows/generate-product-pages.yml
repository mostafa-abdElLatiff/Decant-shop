name: Generate product pages

# Regenerates products/<id>.html (thin share-preview/SEO redirect shims,
# see generate_product_pages.py's own docstring) whenever products.json
# changes via a path that ISN'T the scheduled sync-stores.yml run:
#   - admin.html edits (commits straight to the repo via the GitHub
#     Contents API with your own PAT — never runs a local script)
#   - a manual `git push` from your own machine
#   - a manual extract.py/merge-script run you push yourself
#
# The scheduled-sync path is handled separately, by a step inside
# sync-stores.yml itself — a push made with that job's own GITHUB_TOKEN
# does not trigger this workflow's `push` event, by GitHub's own
# loop-prevention design (intentional, to stop workflows retriggering
# each other forever). This workflow is the backstop for every other way
# products.json can change.

on:
  push:
    paths:
      - "products.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-product-pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate product pages
        run: python generate_product_pages.py

      # See sync-stores.yml's own "Push commits" step for why this isn't
      # a bare `git push` -- same non-fast-forward race, just a shorter
      # window here since this job only runs generate_product_pages.py.
      - name: Push commits
        run: |
          set +e
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if [ $? -ne 0 ]; then
              git rebase --abort
              echo "Rebase failed on attempt $i, retrying..."
              sleep $((RANDOM % 10 + 5))
              continue
            fi
            git push origin main
            if [ $? -eq 0 ]; then
              echo "Pushed successfully on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed (remote moved), retrying..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "::error::Failed to push after 5 attempts -- remote kept moving."
          exit 1
