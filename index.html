<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14160F; --ink:#EEEBDD;
    --olive:#93B255; --olive-deep:#B8D678; --brass:#E0B85B;
    --card:#1D2016; --line:#33362A; --red:#E2795F;
    --radius:14px; --shadow:0 2px 14px rgba(0,0,0,.35);
    font-size:16px;
  }
  :root[data-theme="light"]{
    --bg:#F7F4EC; --ink:#22251B;
    --olive:#5A6B2F; --olive-deep:#3E4A1F; --brass:#B08D3E;
    --card:#FFFFFF; --line:#E3DECF; --red:#B4462F;
    --shadow:0 2px 14px rgba(34,37,27,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:
      radial-gradient(1100px 500px at 12% -10%, color-mix(in srgb, var(--olive) 10%, transparent), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, color-mix(in srgb, var(--brass) 7%, transparent), transparent 55%),
      var(--bg);
    color:var(--ink);font-family:'Manrope','IBM Plex Sans Arabic',sans-serif;line-height:1.6}
  h1,h2,h3{font-family:inherit;font-weight:800}
  ::selection{background:var(--olive);color:#12140D}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;border:3px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--olive)}

  .shell{display:grid;grid-template-columns:272px 1fr;min-height:100vh}

  /* ---------- sidebar ---------- */
  .sidebar{background:var(--card);border-inline-end:1px solid var(--line);padding:1.5rem 1.3rem;display:flex;flex-direction:column;gap:1.5rem;position:sticky;top:0;height:100vh;overflow-y:auto}
  .wordmark{display:block;text-decoration:none;cursor:pointer;transition:opacity .15s;display:flex;flex-direction:column;gap:.15rem}
  .wordmark:hover{opacity:.85}
  .wordmark:focus-visible{outline:3px solid var(--brass);outline-offset:4px;border-radius:6px}
  .wordmark h1{font-size:1.5rem;line-height:1.05;letter-spacing:.005em;background:linear-gradient(100deg, var(--ink) 40%, var(--olive-deep));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .wordmark small{color:var(--olive);font-size:.74rem;letter-spacing:.02em}

  .clear-filters-btn{align-self:flex-start;background:none;border:1.5px solid var(--red);color:var(--red);font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;padding:.5rem .9rem;border-radius:999px;min-height:2.75rem;transition:background .15s}
  .clear-filters-btn:hover{background:color-mix(in srgb, var(--red) 12%, transparent)}

  .filter-section{border-top:1px solid var(--line);padding-top:1.05rem}
  .filter-section:first-of-type{border-top:none;padding-top:0}
  .filter-section summary{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);cursor:pointer;list-style:none}
  .filter-section summary::-webkit-details-marker{display:none}
  .filter-section summary::after{content:"+";color:var(--olive);font-size:1.15rem;font-weight:400;line-height:1}
  .filter-section[open] summary::after{content:"–"}
  .filter-list{display:flex;flex-direction:column;gap:.1rem;margin-top:.7rem;max-height:230px;overflow-y:auto}
  .size-subfilter{margin-top:.5rem;margin-inline-start:.9rem;padding-inline-start:.8rem;border-inline-start:2px solid var(--line)}
  .size-subfilter-label{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--olive);margin-top:.6rem}
  .size-subfilter .filter-list{max-height:180px}
  .stock-toggle{display:flex;align-items:center;gap:.55rem;font-size:.85rem;font-weight:600;color:var(--ink);cursor:pointer;user-select:none;padding:.4rem 0}
  .stock-toggle input{width:16px;height:16px;accent-color:var(--olive);cursor:pointer;flex:none}
  .filter-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.6rem .5rem;font-size:.85rem;font-weight:500;color:var(--ink);cursor:pointer;border-radius:6px;background:none;border:none;font-family:inherit;width:100%;text-align:start}
  .filter-row:hover{color:var(--olive-deep)}
  .filter-row[aria-pressed="true"]{color:var(--olive-deep);font-weight:700}
  .filter-row-label{display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filter-row .count{font-size:.72rem;color:var(--ink);opacity:.45;font-variant-numeric:tabular-nums;flex-shrink:0}
  .filter-row .swatch{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--olive);margin-inline-end:.55rem;flex-shrink:0}
  .filter-row[aria-pressed="true"] .swatch{background:var(--olive)}

  .price-range{display:flex;align-items:center;gap:.5rem;margin-top:.7rem}
  .price-range input{width:0;flex:1;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:.5rem .6rem;font-family:inherit;font-size:.88rem;min-height:2.75rem;transition:border-color .15s}
  .price-range input:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px color-mix(in srgb, var(--olive) 22%, transparent)}
  .price-range-sep{color:#8A8D7B;font-size:.85rem;flex-shrink:0}

  .select-clearable{position:relative;margin-top:.7rem}
  .store-select{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:.5rem 1rem;font-family:inherit;font-size:.85rem;cursor:pointer;transition:border-color .15s}
  .store-select:hover{border-color:var(--olive)}
  .store-select:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .select-clearable:has(.select-clear:not([hidden])) .store-select{padding-inline-end:2.6rem}
  .select-clear{position:absolute;top:50%;inset-inline-end:.4rem;transform:translateY(-50%);background:none;border:none;color:var(--red);font-size:1.05rem;line-height:1;cursor:pointer;width:2rem;height:2rem;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .select-clear:hover{background:color-mix(in srgb, var(--red) 15%, transparent)}
  .select-clear:focus-visible{outline:2px solid var(--brass);outline-offset:1px}

  .view-toggle{display:flex;gap:2px;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:3px;margin-top:.7rem}
  .view-btn{flex:1;border:none;background:transparent;color:var(--ink);cursor:pointer;font-family:inherit;font-size:.78rem;font-weight:700;padding:.6rem .7rem;border-radius:999px;transition:background .15s,color .15s;line-height:1}
  .view-btn:hover{color:var(--olive-deep)}
  .view-btn[aria-pressed="true"]{background:var(--olive);color:#12140D}
  .view-btn:focus-visible{outline:3px solid var(--brass);outline-offset:1px}

  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
  .sidebar-overlay.open{opacity:1;pointer-events:auto}
  @media (max-width:860px){
    .shell{grid-template-columns:minmax(0,1fr)}
    .sidebar{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(320px,86vw);height:auto;z-index:70;
      transform:translateX(-100%);transition:transform .25s ease;box-shadow:8px 0 30px rgba(0,0,0,.3)}
    [dir="rtl"] .sidebar{transform:translateX(100%)}
    .sidebar.open{transform:translateX(0)}
  }

  /* ---------- topbar (main column) ---------- */
  .topbar{display:flex;align-items:center;gap:.7rem;padding:1rem 1.3rem;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:40}
  .filters-toggle{display:none;align-items:center;gap:.4rem;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:.55rem .8rem;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;flex-shrink:0}
  .filters-toggle:hover{border-color:var(--olive)}
  .filter-badge{background:var(--brass);color:#12140D;border-radius:999px;min-width:1.2rem;height:1.2rem;display:inline-flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;padding:0 .3rem}
  .filter-badge[hidden]{display:none}
  .search-wrap{position:relative;flex:1;min-width:160px;max-width:420px}
  .search-icon{position:absolute;inset-inline-start:.85rem;top:50%;transform:translateY(-50%);font-size:.85rem;opacity:.6;pointer-events:none}
  .search{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);padding:.6rem 1rem .6rem 2.35rem;font-family:inherit;font-size:.92rem;color:var(--ink);transition:border-color .15s, box-shadow .15s}
  [dir="rtl"] .search{padding:.6rem 2.35rem .6rem 1rem}
  .search:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px color-mix(in srgb, var(--olive) 22%, transparent)}
  .topbar-spacer{flex:1}
  .icon-btn{background:transparent;border:1.5px solid var(--line);color:var(--ink);cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:600;padding:.5rem .8rem;border-radius:999px;transition:border-color .15s ease, background .15s ease, transform .15s ease}
  .icon-btn:hover{border-color:var(--olive);transform:translateY(-1px)}
  .icon-btn[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#12140D}
  .cart-btn{background:linear-gradient(135deg, var(--brass), color-mix(in srgb, var(--brass) 75%, #fff));color:#1a1a12;border:none;cursor:pointer;font-family:inherit;font-size:.95rem;font-weight:700;padding:.55rem 1.1rem;border-radius:999px;display:flex;align-items:center;gap:.5rem;transition:transform .15s, box-shadow .15s;box-shadow:0 2px 10px color-mix(in srgb, var(--brass) 35%, transparent)}
  .cart-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px color-mix(in srgb, var(--brass) 45%, transparent)}
  .cart-btn:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
  .cart-count{background:#1a1a12;color:var(--brass);border-radius:999px;min-width:1.4rem;height:1.4rem;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
  @media (max-width:640px){
    .filters-toggle{display:flex}
    .topbar{flex-wrap:wrap}
  }

  .disclaimer{max-width:1200px;margin:0;padding:1rem 1.3rem 0;font-size:.76rem;color:#8A8D7B;line-height:1.5}
  /* Sits right above the results grid (not tucked away in the sidebar,
     which can be scrolled past or, on narrow screens, closed entirely)
     so it's never a mystery why the list looks the way it does when more
     than one facet (kind, store, ...) is filtering it at once. */
  .active-filters{max-width:1200px;margin:0;padding:.7rem 1.3rem 0;display:flex;flex-wrap:wrap;gap:.4rem}
  .active-filters[hidden]{display:none}
  .active-filter-chip{display:inline-flex;align-items:center;gap:.35rem;background:var(--card);border:1.5px solid var(--olive);border-radius:999px;padding:.3rem .4rem .3rem .75rem;font-size:.78rem;font-weight:600;color:var(--olive-deep);cursor:pointer;font-family:inherit}
  .active-filter-chip:hover{border-color:var(--red)}
  .active-filter-chip .x{display:inline-flex;align-items:center;justify-content:center;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--line);font-size:.7rem;line-height:1}
  .active-filter-chip:hover .x{background:var(--red);color:#fff}
  .active-filters-clear{background:none;border:none;color:var(--red);font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;padding:.3rem .2rem;text-decoration:underline}
  .site-footer{margin-top:auto;padding-top:1.05rem;border-top:1px solid var(--line);font-size:.72rem;color:#8A8D7B;line-height:1.55}
  .site-footer a{color:var(--olive-deep)}

  .grid{max-width:1200px;margin:0;padding:1rem 1.3rem 4rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.2rem}
  .grid[data-cols="1"]{grid-template-columns:1fr}
  .grid[data-cols="2"]{grid-template-columns:repeat(2,1fr)}
  .grid[data-cols="3"]{grid-template-columns:repeat(3,1fr)}
  @media (max-width:520px){ .grid[data-cols="3"]{gap:.6rem} .grid[data-cols="2"]{gap:.7rem} }
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;outline:0 solid transparent;transition:outline-color .3s, transform .15s ease, border-color .15s ease;
    animation:card-in .35s ease backwards}
  .card:hover{transform:translateY(-3px);border-color:color-mix(in srgb, var(--olive) 45%, var(--line))}
  .card.flash{outline:3px solid var(--brass);outline-offset:2px}
  @keyframes card-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){.card{animation:none}}
  .card-img{position:relative;height:190px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--line),var(--bg));font-size:3.4rem;overflow:hidden}
  .card-img img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;transition:transform .4s ease}
  .card:hover .card-img img{transform:scale(1.05)}
  .card-share{position:absolute;top:.55rem;inset-inline-end:.55rem;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:2.75rem;height:2.75rem;font-size:1rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s, transform .15s;z-index:2}
  .card-share:hover{background:rgba(0,0,0,.75);transform:scale(1.08)}
  .card-share:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  /* top-end, same corner as .card-share but inset further in so the two
     don't overlap -- top-start is already spoken for by
     .product-modal-close (see its own comment on why). */
  .card-fav{position:absolute;top:.55rem;inset-inline-end:3.55rem;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:2.75rem;height:2.75rem;font-size:1.05rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s, transform .15s;z-index:2}
  .card-fav:hover{background:rgba(0,0,0,.75);transform:scale(1.08)}
  .card-fav:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .card-fav[aria-pressed="true"]{color:#ff6161}
  .card-fav .fav-changed-dot{position:absolute;top:-2px;inset-inline-end:-2px;width:.65rem;height:.65rem;border-radius:50%;background:var(--brass);border:2px solid rgba(0,0,0,.55)}
  /* Higher than .product-modal (111) -- a photo zoomed from inside the
     product modal must render on top of it, not behind. Still below
     .toast (120) so an "Added" confirmation stays visible over a
     zoomed photo too. */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:115;display:flex;align-items:center;justify-content:center;padding:2rem;opacity:0;pointer-events:none;transition:opacity .2s}
  .lightbox.open{opacity:1;pointer-events:auto}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .lightbox-close{position:fixed;top:1.1rem;inset-inline-end:1.2rem;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:1.6rem;line-height:1;width:2.75rem;height:2.75rem;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .product-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:110;opacity:0;pointer-events:none;transition:opacity .2s}
  .product-modal-overlay.open{opacity:1;pointer-events:auto}
  .product-modal{position:fixed;inset:0;z-index:111;display:flex;align-items:center;justify-content:center;padding:1.2rem;opacity:0;pointer-events:none;transition:opacity .2s}
  .product-modal.open{opacity:1;pointer-events:auto}
  .product-modal-panel{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
  .product-modal-panel .card{border:none;border-radius:0;box-shadow:none;animation:none}
  /* top-START, not top-end: the card-share button rendered inside the
     modal body sits at top-end of the same image — same corner would
     visually collide with (and click-intercept over) that button. */
  .product-modal-close{position:absolute;top:.6rem;inset-inline-start:.6rem;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:2.75rem;height:2.75rem;font-size:1.6rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3}
  .product-modal-close:hover{background:rgba(0,0,0,.75)}
  .card-body{padding:1rem 1.1rem 1.2rem;display:flex;flex-direction:column;gap:.6rem;flex:1}
  .card-body h3{font-size:1.08rem;line-height:1.35}
  .card-title-btn{background:none;border:none;padding:.7rem 0;margin:-.7rem 0;min-height:2.75rem;display:flex;align-items:center;font:inherit;color:inherit;text-align:start;cursor:pointer}
  .card-title-btn:hover{text-decoration:underline}
  .card-brand-row{display:flex;align-items:center;gap:.4rem;margin:0 0 -.9rem;flex-wrap:wrap}
  .card-brand{align-self:flex-start;background:none;border:none;color:var(--olive);font-family:inherit;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;min-height:2.75rem;display:flex;align-items:center;padding:0 .2rem;margin:0 -.2rem;direction:ltr}
  .card-brand:hover{text-decoration:underline}
  .category-badge{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:.2rem .5rem;border-radius:20px;line-height:1.5;white-space:nowrap}
  .category-badge.cat-designer{background:color-mix(in srgb, #6b8cae 20%, transparent);color:#6b8cae}
  .category-badge.cat-niche{background:color-mix(in srgb, var(--brass) 22%, transparent);color:var(--brass)}
  .category-badge.cat-dupe{background:color-mix(in srgb, var(--olive) 20%, transparent);color:var(--olive-deep)}
  .name-alt{font-size:.8rem;color:#8A8D7B;direction:ltr;text-align:start}
  .dupe-of,.duped-by{font-size:.78rem;color:var(--brass);font-weight:600}
  .dupe-of a,.duped-by a{color:var(--brass);text-decoration:underline;cursor:pointer;background:none;border:none;font:inherit;min-height:2.75rem;display:inline-flex;align-items:center;padding:0 .2rem;margin:0 -.2rem}
  .accords{display:flex;flex-direction:column;gap:3px;margin-top:.1rem}
  .accords-toggle{align-self:flex-start;background:none;border:none;color:var(--olive-deep);font-size:.76rem;font-weight:600;cursor:pointer;min-height:2.75rem;display:flex;align-items:center;padding:0 .2rem;margin:0 -.2rem -.5rem}
  .accord{height:1.3rem;border-radius:5px;display:flex;align-items:center;padding:0 .6rem;font-size:.7rem;font-weight:600;color:rgba(0,0,0,.68);box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 -1px 2px rgba(0,0,0,.12)}
  .stores-toggle{align-self:flex-start;background:none;border:none;color:var(--olive-deep);font-size:.76rem;font-weight:600;cursor:pointer;min-height:2.75rem;display:flex;align-items:center;padding:0 .2rem;margin:0 -.2rem -.5rem}
  .store-block{border-top:1px dashed var(--line);padding-top:.55rem;margin-top:.15rem}
  .store-name{font-size:.85rem;font-weight:700;margin-bottom:.35rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}

// Filter/search/pagination state gets restored manually on popstate (see
// syncURLState/applyParamsToState below) since it depends on renderedCount
// being caught up before scrolling makes sense — letting the browser's
// own automatic restoration fire first would scroll against a grid that's
// still only page 1 tall.
if("scrollRestoration" in history) history.scrollRestoration = "manual";

let SETTINGS = {};
let PRODUCTS = [];
let byId = {}; // built once by buildLookups() after PRODUCTS loads, not per-card
let cart = []; // {key, productId, storeIdx, offerIdx, qty}
try{ cart = JSON.parse(localStorage.getItem("cart") || "[]"); }catch{ cart = []; }
const saveCart = () => localStorage.setItem("cart", JSON.stringify(cart));

// Favorites live entirely client-side (localStorage), same as the cart —
// there's no backend/account system to attach them to server-side. Real
// push/email notifications would need one; instead, favSnapshots records
// a serialized summary of a favorited product's offers at the moment it
// was favorited (or last checked via the "My favorites" toggle), and
// hasFavChanged() compares that against the product's CURRENT offers on
// every render — leveraging price/store history the catalog already
// tracks (prev_price, first_seen) rather than building new
// infrastructure for something a simple diff already answers.
let favorites = new Set();
try{ favorites = new Set(JSON.parse(localStorage.getItem("favorites") || "[]")); }catch{ favorites = new Set(); }
let favSnapshots = {};
try{ favSnapshots = JSON.parse(localStorage.getItem("favSnapshots") || "{}"); }catch{ favSnapshots = {}; }
const saveFavorites = () => localStorage.setItem("favorites", JSON.stringify([...favorites]));
const saveFavSnapshots = () => localStorage.setItem("favSnapshots", JSON.stringify(favSnapshots));
function favSnapshotFor(p){
  return (p.stores||[]).flatMap(s => (s.offers||[]).map(o => `${s.name}|${o.kind}|${o.ml}|${o.price}|${o.sold_since||""}`)).sort().join(",");
}
function hasFavChanged(p){
  const snap = favSnapshots[p.id];
  return snap != null && snap !== favSnapshotFor(p);
}
function countChangedFavorites(){
  let n = 0;
  favorites.forEach(id => { const p = byId[id]; if(p && hasFavChanged(p)) n++; });
  return n;
}
function updateFavoritesLabel(){
  const el = document.getElementById("favoritesOnlyLabel");
  if (!el) return;
  const changed = countChangedFavorites();
  el.textContent = changed ? `${t().favorites_only} (${t().favorites_changed.replace("{n}", changed)})` : t().favorites_only;
}
// Kind and store are multi-select (a set of values; empty = "all", no
// filter) — a shopper comparing "full bottle OR leftover" across several
// stores at once needs both selected at the same time, not one or the
// other. Size/brand/sort stay single-select — there's no equivalent
// "want either of these" case for them in how this catalog gets browsed.
let kindFilter = new Set();
let storeFilters = new Set();
// Multi-select like kindFilter/storeFilters (a shopper wanting "niche OR
// dupe" needs both selected at once), values are brand_category()'s own
// "designer"/"niche"/"dupe" strings. A product with no category
// (brand not yet classified) simply never matches any category filter.
let categoryFilter = new Set();
let brandFilter = "all";
let sortOrder = "newest";
let query = "";
let inStockOnly = false;

// never removes a product from the grid, only changes what's shown

// Unlike bestOfferOnly, this DOES remove non-favorited products from the
// grid (it's a real filter, not a rendering-mode toggle) — hooks into
// computeItems() the same way inStockOnly hooks into
// productHasMatchingOffer().
let favoritesOnly = false;
let priceMin = null;
let priceMax = null;
let sizeFilter = "all"; // only meaningful when kindFilter has "decant" — see the Size sub-filter
let lang = localStorage.getItem("lang") || "en";
let theme = localStorage.getItem("theme") || "dark";
let gridCols = localStorage.getItem("gridCols") || "auto";

// Rendering the full catalog's cards at once got noticeably heavy on
// mobile as the product count grew past ~1000 — render in pages instead,
// growing the DOM only as the user actually scrolls down.
const PAGE_SIZE = 24;
let currentItems = [];
let renderedCount = 0;

const grid = document.getElementById("grid");
const t = () => I18N[lang];

// The Size sub-filter is one shared DOM node re-parented on every
// populateKindFilter() call (see there) rather than a fixed sibling
// after the whole kind list -- cached once so a rebuild of #kindList's
// innerHTML never destroys it (it just gets detached, then re-attached
// by the code that moves it).
const kindSizeSubfilter = document.getElementById("sizeSubfilter");
const kindFilterSection = kindSizeSubfilter.parentElement;

/* --- Smart search ---------------------------------------------------
   Goals: doesn't need an exact substring match (typo-tolerant), works
   regardless of whether the query is Arabic or English, matches on
   brand as well as name, and understands common niche-fragrance-
   community shorthand for both brands and specific lines. */

// strips Latin accents AND Arabic diacritics (tashkeel) via the same
// Unicode decomposition, so "Déclaration"/"declaration" and Arabic text
// with/without harakat both normalize to the same comparable form.
const normalizeText = s => (s||"").normalize("NFKD").replace(/[\u0300-\u036f\u064b-\u065f\u0670\u06d6-\u06ed]/g, "").toLowerCase();

// shortcut -> the full text it should also match; expanded onto the
// product's own searchable text (not the query) so typing either the
// shortcut or the full name finds the same products.
const SEARCH_ALIASES = {
  "ysl": "yves saint laurent", "mfk": "maison francis kurkdjian",
  "pdm": "parfums de marly", "tf": "tom ford", "jpg": "jean paul gaultier",
  "cdn": "club de nuit", "shl": "stephane humbert lucas",
  "dg": "dolce gabbana", "d&g": "dolce gabbana", "ea": "emporio armani",
  "mmk": "maison francis kurkdjian", "ck": "calvin klein",
  "ffm": "fragrance world", "fw": "fragrance world",
};

function buildSearchHaystack(p){
  let text = normalizeText([p.name_en, p.name_ar, p.brand, ...(p.dupe_of||[])].filter(Boolean).join(" "));
  for(const [short, full] of Object.entries(SEARCH_ALIASES)){
    if(text.includes(full)) text += " " + short;
  }
  return text;
}

// bounded edit distance — bails early once the two strings' lengths
// differ by more than the max allowed distance, since 939 products'
// worth of these run on every keystroke that doesn't exact-match.
function editDistanceWithin(a, b, max){
  if(Math.abs(a.length - b.length) > max) return false;
  const dp = [];
  for(let i=0;i<=a.length;i++) dp.push([i, ...Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++) dp[0][j] = j;
  for(let i=1;i<=a.length;i++){
    for(let j=1;j<=b.length;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[a.length][b.length] <= max;
}

// exact substring first (cheap, catches the vast majority of searches);
// only falls back to fuzzy per-word comparison — allowing a 1-character
// typo for short-ish words and 2 for longer ones — when that fails, and
// only for tokens long enough that a fuzzy match means something.
function tokenMatchesHaystack(token, haystack){
  if(haystack.includes(token)) return true;
  if(token.length < 4) return false;
  const maxDist = token.length > 6 ? 2 : 1;
  return haystack.split(" ").some(w => w.length >= 3 && editDistanceWithin(token, w, maxDist));
}

function productMatchesQuery(p, qTokens){
  if(!qTokens.length) return true;
  if(!p._searchHaystack) p._searchHaystack = buildSearchHaystack(p);
  return qTokens.every(tok => tokenMatchesHaystack(tok, p._searchHaystack));
}
const slugify = s => (s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
/* dupe_of entries are stored "Name — Brand" (free text, AI-vision-extracted
   from a bottle photo — never validated/normalized in extract.py or
   admin.html). Matching used to slugify the "Name" part and look it up as
   if it equalled a product's id, but a product's id is NOT reliably
   slugify(name_en) -- unique_id_for() disambiguates collisions with a
   brand/timestamp suffix, and ids go stale after a rename or merge (the
   OLD name stays only in name_en's replacement or in aliases[]). Matching
   by normalized NAME text instead -- checking both name_en and aliases --
   survives all of that, since dupe_of references a name, not an id. */
const dupeName = s => normalizeText((s||"").split(/\s+—\s+/)[0]);
let byNormName = {};
function buildLookups(){
  byId = Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));
  byNormName = {};
  PRODUCTS.forEach(p => {
    [p.name_en, ...(p.aliases||[])].filter(Boolean).forEach(name => {
      const k = normalizeText(name);
      if(!byNormName[k]) byNormName[k] = p; // first-match-wins on a rare exact-name collision
    });
  });
}
const pname = (p, forceLang) => (forceLang||lang)==="ar" ? (p.name_ar||p.name_en) : (p.name_en||p.name_ar);
/* The alt-name line under the title is only useful when it actually adds
   information — skip it if there's no Arabic/English name on file, or if
   the two are just the same text (nothing to translate/transliterate). */
const pname_alt = p => {
  const alt = lang==="ar" ? p.name_en : p.name_ar;
  if(!alt || alt.trim().toLowerCase() === pname(p).trim().toLowerCase()) return "";
  return alt;
};
const nlabel = n => lang==="ar" ? (n.label_ar||n.label_en) : (n.label_en||n.label_ar);

function offerLabel(o, forceLang){
  const useLang = forceLang || lang;
  const tt = I18N[useLang];
  const size = o.ml==="as-shown" ? tt.as_shown : (useLang==="ar" ? `${o.ml} مل` : `${o.ml}ml`);
  const tags = [];
  if(o.kind==="full") tags.push(tt.full_tag);
  else if(o.kind==="leftover") tags.push(tt.leftover_tag);
  if(o.tester) tags.push(tt.tester_tag);
  if(o.note) tags.push(o.note);
  return tags.length ? `${size} "${tags.join(" — ")}"` : size;
}

const NEW_BADGE_DAYS = 5;
// Paused on 2026-07-17 (large backfill made "New" fire on lots of old
// offers at once) — only offers first seen after this date show the badge.
// To fully re-enable, delete the o.first_seen <= NEW_BADGE_SINCE check below.
const NEW_BADGE_SINCE = "2026-07-17";
function isNewOffer(o){
  if(!o.first_seen || o.first_seen <= NEW_BADGE_SINCE) return false;
  // days can be slightly negative near a UTC day boundary (first_seen is a
  // local calendar date, parsed here as UTC midnight) — still "new" either way
  const days = (Date.now() - new Date(o.first_seen)) / 86400000;
  return days <= NEW_BADGE_DAYS;
}

function productHasKind(p, kind){
  return (p.stores||[]).some(s => (s.offers||[]).some(o => o.kind===kind));
}

// The kind/store/in-stock filters must all be satisfied by the SAME
// offer, not independently anywhere on the product — otherwise
// selecting "Decants" + a specific store shows a product whose decant
// is at a DIFFERENT store and whose offer at the selected store is a
// full bottle, or "In stock only" + a store shows a product that's
// sold out at that exact store but happens to still be in stock
// elsewhere. kinds/storeNames are Sets (multi-select: a product matches
// if ANY selected value is satisfied — empty/null means unfiltered, same
// as the old "all"); inStockOnly is a plain optional boolean.
function productHasMatchingOffer(p, {kinds=null, storeNames=null, inStockOnly=false, minPrice=null, maxPrice=null, ml=null}={}){
  return (p.stores||[]).some(s =>
    (!storeNames || storeNames.size===0 || storeNames.has(s.name)) &&
    (s.offers||[]).some(o =>
      (!kinds || kinds.size===0 || kinds.has(o.kind)) &&
      (!inStockOnly || !o.sold_since) &&
      (minPrice==null || o.price >= minPrice) &&
      (maxPrice==null || o.price <= maxPrice) &&
      (ml==null || o.ml === ml)
    )
  );
}

/* Kind/Store/Sort all render as clickable rows in the sidebar (rather than
   native <select>s) now that they live in a persistent panel instead of a
   toolbar dropdown — Brand stays a <select> since it can run to hundreds
   of entries, where a native picker's typeahead/scroll beats a bespoke list.
   Each entry carries its own `active` flag (computed by the caller, which
   already knows whether it's single- or multi-select) rather than this
   function comparing against one shared "active value" — that's what lets
   Kind/Store show more than one row pressed at once. */
function buildFilterRows(container, entries, onPick){
  container.innerHTML = entries.map(e => `
    <button class="filter-row" type="button" data-value="${e.value}" aria-pressed="${String(!!e.active)}">
      <span class="filter-row-label">${e.swatch ? '<span class="swatch"></span>' : ''}${e.label}</span>
      ${e.count!=null ? `<span class="count">${e.count}</span>` : ""}
    </button>`).join("");
  container.querySelectorAll(".filter-row").forEach(row => {
    row.addEventListener("click", () => onPick(row.dataset.value));
  });
}

// A brand match is the one filter check that lives outside
// productHasMatchingOffer (it's a per-PRODUCT field, not a per-offer
// one) — every populate*Filter() below needs it alongside that helper to
// build counts that reflect ALL the other currently-active filters, not
// just the one facet being listed. Without this, e.g. picking a store
// and then "Decants" left the size sub-filter showing every size that
// exists ANYWHERE in the whole catalog, most of which that store doesn't
// even carry — the counts were real, just for the wrong (unfiltered) set.
function productMatchesBrand(p){
  return brandFilter==="all" || (p.brand||"").trim().toLowerCase()===brandFilter;
}

function productMatchesCategory(p){
  return categoryFilter.size===0 || categoryFilter.has(p.category||"");
}

// Kind, Size, and Store's own counts (and, for Kind/Size, which options
// even show up at all) each depend on EVERY other active filter --
// brand/in-stock/price included, not just kind vs. store. Any handler
// that changes ANY filter must call all three populate*Filter()s or
// whichever panels it skips go stale and can get stuck showing options
// that no longer apply (or hiding ones that do) until their own row
// happens to be clicked directly. Centralized here after this bug
// turned up independently in three separate call sites (the sidebar's
// own row handlers, the active-filters bar's chip removal, and -- next
// -- brand/price/stock, which have the exact same dependency and would
// otherwise repeat it a fourth time).
function refreshFilterPanels(){
  populateKindFilter();
  populateSizeFilter();
  populateStoreFilter();
  populateCategoryFilter();
}

const CATEGORY_VALUES = ["designer","niche","dupe"];
const categoryLabel = c => c==="designer" ? t().category_designer : c==="niche" ? t().category_niche : t().category_dupe;

function populateCategoryFilter(){
  const counts = { all: 0, designer: 0, niche: 0, dupe: 0 };
  const opts = { kinds: kindFilter, storeNames: storeFilters, inStockOnly, minPrice: priceMin, maxPrice: priceMax, ml: sizeFilter==="all" ? null : Number(sizeFilter) };
  PRODUCTS.forEach(p => {
    if(!productMatchesBrand(p)) return;
    if(!productHasMatchingOffer(p, opts)) return;
    counts.all++;
    if(counts[p.category] != null) counts[p.category]++;
  });
  const entries = [
    { value:"all", label:t().filter_all, count:counts.all, swatch:true, active: categoryFilter.size===0 },
    ...CATEGORY_VALUES.map(c => ({ value:c, label:categoryLabel(c), count:counts[c], swatch:true, active: categoryFilter.has(c) })),
  ].filter(e => e.value==="all" || e.active || e.count>0);
  buildFilterRows(document.getElementById("categoryList"), entries, value => {
    captureScrollState();
    if(value==="all") categoryFilter.clear();
    else if(categoryFilter.has(value)) categoryFilter.delete(value);
    else categoryFilter.add(value);
    refreshFilterPanels();
    updateFilterBadge();
    render();
    syncURLState();
    trackEvent("filter_category", { value: [...categoryFilter].join(",") || "all" });
  });
}

function populateKindFilter(){
  const counts = { all: 0, decant: 0, full: 0, leftover: 0 };
  PRODUCTS.forEach(p => {
    if(!productMatchesBrand(p)) return;
    const opts = { storeNames: storeFilters, inStockOnly, minPrice: priceMin, maxPrice: priceMax };
    if(productHasMatchingOffer(p, { ...opts, kinds:null })) counts.all++;
    ["decant","full","leftover"].forEach(k => {
      if(productHasMatchingOffer(p, { ...opts, kinds:new Set([k]) })) counts[k]++;
    });
  });
  const entries = [
    { value:"all", label:t().filter_all, count:counts.all, swatch:true, active: kindFilter.size===0 },
    { value:"decant", label:t().filter_decant, count:counts.decant, swatch:true, active: kindFilter.has("decant") },
    { value:"full", label:t().filter_full, count:counts.full, swatch:true, active: kindFilter.has("full") },
    { value:"leftover", label:t().filter_leftover, count:counts.leftover, swatch:true, active: kindFilter.has("leftover") },
  ].filter(e => e.value==="all" || e.active || e.count>0);
  buildFilterRows(document.getElementById("kindList"), entries, value => {
    captureScrollState();
    if(value==="all") kindFilter.clear();
    else if(kindFilter.has(value)) kindFilter.delete(value);
    else kindFilter.add(value);
    if(!kindFilter.has("decant")) sizeFilter = "all"; // the sub-filter only means anything under Decants
    refreshFilterPanels();
    updateFilterBadge();
    render();
    syncURLState();
    trackEvent("filter_kind", { value: [...kindFilter].join(",") || "all" });
  });
  // Re-nest the size sub-filter directly under whichever row is Decant's
  // right now, instead of leaving it a fixed sibling after the WHOLE
  // kind list -- that fixed position put it under Full or Leftover
  // whenever either of THOSE happened to render as the last visible row
  // (e.g. a store with no full-bottle offers leaves [All, Decant,
  // Leftover], and the old fixed position landed the sub-filter under
  // Leftover instead of Decant). Falls back to appending it at the end
  // of the section on the rare case Decant itself is hidden entirely.
  const decantRow = document.querySelector('#kindList .filter-row[data-value="decant"]');
  if(decantRow) decantRow.insertAdjacentElement("afterend", kindSizeSubfilter);
  else kindFilterSection.appendChild(kindSizeSubfilter);
}

// Sizes only apply to decant offers — a "50ml" full bottle and a "50ml"
// decant aren't the same shopping decision, and leftover offers are
// almost always "as shown" (no fixed size) in this catalog, so mixing
// either into one flat size list would be misleading. Shown as a
// sub-filter under Type > Decants instead of its own top-level filter.
function populateSizeFilter(){
  document.getElementById("sizeSubfilter").hidden = !kindFilter.has("decant");
  if(!kindFilter.has("decant")) return;
  const counts = {};
  PRODUCTS.forEach(p => {
    if(!productMatchesBrand(p)) return;
    const mls = new Set();
    (p.stores||[]).forEach(s => {
      if(storeFilters.size && !storeFilters.has(s.name)) return;
      (s.offers||[]).forEach(o => {
        if(o.kind === "decant" && typeof o.ml === "number" &&
           (!inStockOnly || !o.sold_since) &&
           (priceMin==null || o.price >= priceMin) &&
           (priceMax==null || o.price <= priceMax)) mls.add(o.ml);
      });
    });
    mls.forEach(ml => { counts[ml] = (counts[ml]||0) + 1; });
  });
  const sizes = Object.keys(counts).map(Number).sort((a,b) => a-b);
  if(sizeFilter !== "all" && !sizes.includes(+sizeFilter)) sizeFilter = "all";
  const entries = [
    { value:"all", label:t().filter_all, active: sizeFilter==="all" },
    ...sizes.map(ml => ({ value:String(ml), label:`${ml}ml`, count:counts[ml], active: sizeFilter===String(ml) })),
  ];
  buildFilterRows(document.getElementById("sizeList"), entries, value => {
    captureScrollState();
    sizeFilter = value;
    refreshFilterPanels();
    updateFilterBadge();
    render();
    syncURLState();
    trackEvent("filter_size", { value });
  });
}

function populateStoreFilter(){
  const allNames = new Set();
  PRODUCTS.forEach(p => (p.stores||[]).forEach(s => allNames.add(s.name)));
  const counts = {};
  const opts = { kinds: kindFilter, inStockOnly, minPrice: priceMin, maxPrice: priceMax, ml: sizeFilter==="all" ? null : Number(sizeFilter) };
  PRODUCTS.forEach(p => {
    if(!productMatchesBrand(p)) return;
    allNames.forEach(name => {
      if(productHasMatchingOffer(p, { ...opts, storeNames:new Set([name]) })) counts[name] = (counts[name]||0) + 1;
    });
  });
  const names = Object.keys(counts).sort();
  // drop any selected store that no longer matches anything under the
  // current other-facet filters (e.g. left over from before switching to
  // a kind that store doesn't carry)
  [...storeFilters].forEach(n => { if(!names.includes(n)) storeFilters.delete(n); });
  const entries = [
    { value:"all", label:t().store_all, active: storeFilters.size===0 },
    ...names.map(n => ({ value:n, label:n, count:counts[n], active: storeFilters.has(n) })),
  ];
  buildFilterRows(document.getElementById("storeList"), entries, value => {
    captureScrollState();
    if(value==="all") storeFilters.clear();
    else if(storeFilters.has(value)) storeFilters.delete(value);
    else storeFilters.add(value);
    refreshFilterPanels();
    updateFilterBadge();
    render();
    syncURLState();
    trackEvent("filter_store", { value: [...storeFilters].join(",") || "all" });
  });
}

/* Brand values in the data aren't perfectly case-normalized (e.g. "French
   Avenue" vs "French avenue" from different sources) — group case/space
   -insensitively so the dropdown doesn't show the same brand twice, and
   display whichever exact casing is most common for that brand. */
function populateBrandFilter(){
  const variants = {};
  PRODUCTS.forEach(p => {
    const b = (p.brand||"").trim();
    if(!b) return;
    const key = b.toLowerCase();
    (variants[key] = variants[key] || {})[b] = (variants[key][b]||0) + 1;
  });
  const entries = Object.entries(variants).map(([key, counts]) => ({
    key,
    display: Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0],
  })).sort((a,b) => a.display.localeCompare(b.display));

  const sel = document.getElementById("brandFilter");
  const prev = sel.value || "all";
  sel.innerHTML = `<option value="all">${t().brand_all}</option>` +
    entries.map(e => `<option value="${e.key}">${e.display}</option>`).join("");
  sel.value = entries.some(e=>e.key===prev) ? prev : "all";
  brandFilter = sel.value;
}

function populateSortOrder(){
  const entries = [
    { value:"newest", label:t().sort_newest, active: sortOrder==="newest" },
    { value:"oldest", label:t().sort_oldest, active: sortOrder==="oldest" },
    { value:"cheapest", label:t().sort_cheapest, active: sortOrder==="cheapest" },
    { value:"default", label:t().sort_default, active: sortOrder==="default" },
  ];
  buildFilterRows(document.getElementById("sortList"), entries, value => {
    captureScrollState();
    sortOrder = value;
    populateSortOrder();
    updateFilterBadge();
    render();
    syncURLState();
    trackEvent("filter_sort", { value });
  });
}

function productCheapestPrice(p){
  let min = Infinity;
  (p.stores||[]).forEach(s => (s.offers||[]).forEach(o => { if(o.price < min) min = o.price; }));
  return min;
}

function productNewestDate(p){
  let latest = "";
  (p.stores||[]).forEach(s => (s.offers||[]).forEach(o => { if(o.first_seen && o.first_seen > latest) latest = o.first_seen; }));
  return latest;
}

async function load(){
  try{
    // No cache-busting here on purpose: products.json only changes every
    // ~2h (sync cron), so letting the browser/CDN cache it (with a normal
    // conditional revalidation) avoids re-downloading the full ~4MB
    // catalog on every single page open, which was the main cause of the
    // "freezes on first load" complaint, especially on mobile networks.
    const res = await fetch("products.json");
    const data = await res.json();
    SETTINGS = data.settings || {};
    PRODUCTS = data.products || [];
    buildLookups();
    // restore filter/search/sort state from the URL (a shared filtered
    // link, or a page reload after the back-button routing below updated
    // it) before the filter UI/grid render off of it
    applyParamsToState(new URLSearchParams(location.search));
    document.getElementById("search").value = query;
    document.getElementById("priceMin").value = priceMin ?? "";
    document.getElementById("priceMax").value = priceMax ?? "";
    document.getElementById("inStockOnly").checked = inStockOnly;
    document.getElementById("bestOfferOnly").checked = bestOfferOnly;
    document.getElementById("favoritesOnly").checked = favoritesOnly;
    applyI18n();
    render();
    syncCart(); // re-resolve any cart restored from localStorage now that PRODUCTS is populated
    // a shared link (#product-id) should land directly on that product's
    // modal, same as clicking a dupe_of/duped_by jump or a card title —
    // all three now go through openProductModal, which renders straight
    // from byId/PRODUCTS rather than needing the grid pre-paginated far
    // enough for the target card to already exist in the DOM.
    const sharedId = location.hash.slice(1);
    if(sharedId && byId[sharedId]) openProductModal(sharedId, {fromHistory:true});
  }catch(e){
    grid.innerHTML = `<p class="empty">${t().load_failed}</p>`;
  }
}

  document.getElementById("copyMsg").textContent = t().copy_btn;
  document.getElementById("clearCart").textContent = t().clear_all_btn;
  document.getElementById("toggleLang").textContent = t().toggle_lang;
  document.getElementById("toggleTheme").textContent = theme==="dark" ? t().theme_to_light : t().theme_to_dark;
  document.getElementById("disclaimer").textContent = t().disclaimer;
  document.getElementById("cartDisclaimer").textContent = t().disclaimer;
  document.getElementById("siteFooter").innerHTML = t().footer_note;
  document.getElementById("kindLabel").textContent = t().label_kind;
  document.getElementById("categoryFilterLabel").textContent = t().label_category;

  document.getElementById("priceFilterLabel").textContent = t().label_price;
  document.getElementById("sizeFilterLabel").textContent = t().label_size;

function computeItems(){
  const qTokens = normalizeText(query).split(/\s+/).filter(Boolean);
  const items = PRODUCTS.filter(p =>
    productHasMatchingOffer(p, {kinds: kindFilter, storeNames: storeFilters, inStockOnly, minPrice: priceMin, maxPrice: priceMax, ml: sizeFilter==="all" ? null : Number(sizeFilter)}) &&
    (brandFilter==="all" || (p.brand||"").trim().toLowerCase()===brandFilter) &&
    productMatchesCategory(p) &&
    (!favoritesOnly || favorites.has(p.id)) &&
    productMatchesQuery(p, qTokens)
  );
  if(sortOrder==="newest") items.sort((a,b) => productNewestDate(b).localeCompare(productNewestDate(a)));
  else if(sortOrder==="oldest") items.sort((a,b) => productNewestDate(a).localeCompare(productNewestDate(b)));
  else if(sortOrder==="cheapest") items.sort((a,b) => productCheapestPrice(a) - productCheapestPrice(b));
  return items;
}

function storeCheapestPrice(s){
  let min = Infinity;
  (s.offers||[]).forEach(o => { if(o.price < min) min = o.price; });
  return min;
}

// Cheapest-first by default, but when one or more stores are actively
// selected in the sidebar, those win first place regardless of price —
// picking "eldesoki-fragrances" should show THAT store's offers up front
// (it's the one collapsed cards default to displaying), not bury it
// behind whichever store merely happens to be cheaper. Shared by the
// initial card render and the "show more stores" lazy-expand below so
// both agree on the same order.
function sortedStoresFor(p){
  return (p.stores||[]).map((s, si) => ({ s, si }))
    .sort((a,b) => {
      if(storeFilters.size){
        const aSel = storeFilters.has(a.s.name) ? 0 : 1;
        const bSel = storeFilters.has(b.s.name) ? 0 : 1;
        if(aSel !== bSel) return aSel - bSel;
      }
      return storeCheapestPrice(a.s) - storeCheapestPrice(b.s);
    });
}

// Powers the "Best offer only" toggle: collapses a product's offers down
// to just the single cheapest one per like-for-like group, comparing
// across every store the product has (or only the selected store(s), if
// any are active in the sidebar) — never across different (kind, ml)
// combinations, since a 100ml full bottle costing less per ml than a
// 3ml decant isn't a "deal", it's just a different format. Mirrors
// findBestDeal()'s own leftover rule: a leftover's remaining ml is
// whatever happened to be left in an opened bottle, not a chosen size,
// so numeric-ml leftovers are compared by price-per-ml across the whole
// kind rather than requiring an exact ml match. An "as-shown" leftover
// has no comparable number at all, so each one is kept as its own
// ungrouped entry rather than force-ranked against unrelated bottles.
function bestOffersFor(p){
  const candidates = (p.stores||[]).map((s, si) => ({ s, si }))
    .filter(({s}) => !storeFilters.size || storeFilters.has(s.name));

  const groups = new Map(); // key -> {s, si, oi, o}
  candidates.forEach(({s, si}) => {
    (s.offers||[]).forEach((o, oi) => {
      const key = o.kind === "leftover"
        ? (o.ml === "as-shown" || !o.ml ? `leftover-as-shown-${si}-${oi}` : "leftover-sized")
        : `${o.kind}-${o.ml}`;
      const entry = { s, si, oi, o };
      const current = groups.get(key);
      if(!current){ groups.set(key, entry); return; }
      // prefer not-sold over sold regardless of price, then cheapest
      // (price-per-ml for the leftover-sized group so different exact
      // ml values still compare fairly; plain price everywhere else,
      // since every offer in a non-leftover group already shares one ml)
      const curSold = !!current.o.sold_since, newSold = !!o.sold_since;
      if(curSold !== newSold){ if(!newSold) groups.set(key, entry); return; }
      const better = key === "leftover-sized"
        ? offerPerMl(o) < offerPerMl(current.o)
        : o.price < current.o.price;
      if(better) groups.set(key, entry);
    });
  });

  const rank = o => o.ml === "as-shown" ? Infinity : o.ml;
  return [...groups.values()].sort((a,b) => rank(a.o) - rank(b.o));
}

// Accord chips and store blocks are factored out of buildCardEl so both
// variants (the grid card's lazy/collapsed rendering and the modal's
// eager/fully-expanded one) call the same markup generator instead of
// maintaining two copies.
function renderAccordsHTML(p){
  return (p.accords||[]).map(a=>`<div class="accord" style="background:${a.color};width:${a.w}%">${nlabel(a)}</div>`).join("");
}

function renderStoresHTML(p, stores){
  return stores.map(({s,si})=>{
    // Offers with their own photo (e.g. a full-bottle listing) get their
    // own thumb+group instead of sharing the store's general one — a
    // single store.image can't represent both a decant vial and a
    // sealed full bottle.
    const groups = [];
    const byImage = new Map();
    // When a kind filter is active, process offers matching it first (a
    // stable sort, so ties keep their original order) -- this floats
    // "Full bottle" to the front of the button row when that's what's
    // selected, and also means the first image-group encountered (and
    // therefore its thumbnail) belongs to a matching offer.
    const offerOrder = (s.offers||[]).map((o,oi) => oi);
    if(kindFilter.size){
      offerOrder.sort((a,b) => (kindFilter.has(s.offers[a].kind)?0:1) - (kindFilter.has(s.offers[b].kind)?0:1));
    }
    offerOrder.forEach(oi => {
      const o = s.offers[oi];
      const img = o.image || s.image || "";
      if (!byImage.has(img)) { byImage.set(img, []); groups.push(img); }
      byImage.get(img).push(oi);
    });
    return `
    <div class="store-block">
      <div class="store-name">
        ${s.url ? `<a href="${s.url}" target="_blank" rel="noopener" data-store-click="${s.name}" data-pid="${p.id}">${s.name}</a>` : s.name}
        ${s.product_url ? `<a class="store-link" href="${s.product_url}" target="_blank" rel="noopener" data-listing-click="${s.name}" data-pid="${p.id}">🔗 ${t().view_listing}</a>` : ""}
      </div>
      ${groups.map(img => `
        <div class="offer-group">
          ${img ? `<img class="store-thumb" src="${img}" alt="${s.name}" loading="lazy" data-pid="${p.id}">` : ""}
          <div class="offers">
            ${byImage.get(img).map(oi => { const o = s.offers[oi]; return `
              <button class="offer-btn${o.sold_since ? " sold" : ""}" data-pid="${p.id}" data-si="${si}" data-oi="${oi}"${o.sold_since ? ` disabled aria-disabled="true"` : ""}>
                ${o.sold_since ? `<span class="sold-badge">${t().sold_badge}</span>` : isNewOffer(o) ? `<span class="new-badge">${t().new_badge}</span>` : ""}
                ${offerLabel(o)} <b>${o.prev_price ? `<span class="prev-price">${o.prev_price}</span>` : ""}${o.price}</b>
              </button>`; }).join("")}
          </div>
        </div>`).join("")}
    </div>`;
  }).join("");
}

// Flat, one-row-per-offer rendering used instead of renderStoresHTML()
// when "Best offer only" is on — no per-store grouping, since the whole
// point is comparing across stores at a glance. Reuses the exact same
// .offer-btn markup/data-* attributes as the normal store view, so the
// existing delegated click handler (add to cart) needs no changes.
function renderBestOffersHTML(p, entries){
  return entries.map(({s, si, oi, o}) => {
    const img = o.image || s.image || "";
    return `
    <div class="offer-group best-offer-row">
      ${img ? `<img class="store-thumb" src="${img}" alt="${s.name}" loading="lazy" data-pid="${p.id}">` : ""}
      <div class="offers">
        <button class="offer-btn${o.sold_since ? " sold" : ""}" data-pid="${p.id}" data-si="${si}" data-oi="${oi}"${o.sold_since ? ` disabled aria-disabled="true"` : ""}>
          ${o.sold_since ? `<span class="sold-badge">${t().sold_badge}</span>` : isNewOffer(o) ? `<span class="new-badge">${t().new_badge}</span>` : ""}
          ${offerLabel(o)} <b>${o.prev_price ? `<span class="prev-price">${o.prev_price}</span>` : ""}${o.price}</b>
        </button>
      </div>
      <div class="best-offer-store">${t().best_offer_from} <bdi>${s.url ? `<a href="${s.url}" target="_blank" rel="noopener" data-store-click="${s.name}" data-pid="${p.id}">${s.name}</a>` : s.name}</bdi></div>
    </div>`;
  }).join("");
}

// expanded:false (default) is the compact grid card — a fast scannable
// summary, cheapest store only, notes/extra stores collapsed behind a
// toggle whose content isn't even injected into the DOM until first
// clicked (see the lazy-injection in the delegated click handler below —
// with thousands of products paginated in, always rendering-but-hiding
// every extra store/note for every card cost real DOM/parse time for
// content most visits never expand). expanded:true is the modal's "see
// everything" view — notes/stores render fully, no toggles, no per-card
// ids (it renders on top of a grid that may already contain the same
// product's own card, so it must never collide with that card's ids).
function buildCardEl(p, {expanded=false}={}){
  const dupeMatches = (p.dupe_of||[]).map(name => ({ name, match: byNormName[dupeName(name)] || null }));
  const dupedBy = PRODUCTS.filter(o => o.id!==p.id && (o.dupe_of||[]).some(d => byNormName[dupeName(d)]?.id === p.id));

  // With more stores added over time a card listing every one in full got
  // unreadably long — show only the cheapest (or, with a store filter
  // active, the selected) store's offers by default, with the rest one
  // toggle away instead of always taking up the full card height.
  const sortedStores = sortedStoresFor(p);
  const bestOffers = bestOfferOnly ? bestOffersFor(p) : null;

  const card = document.createElement("article");
  card.className = "card";
  if(!expanded) card.id = "card-" + p.id;
  card.innerHTML = `
    <div class="card-img">
      ${p.image ? `<img src="${p.image}" alt="${pname(p)}" loading="lazy" data-pid="${p.id}">` : "🧴"}
      <button class="card-share" data-share="${p.id}" aria-label="${t().share_link}" title="${t().share_link}">🔗</button>
      <button class="card-fav" data-fav="${p.id}" aria-pressed="${favorites.has(p.id)}" aria-label="${favorites.has(p.id) ? t().remove_favorite : t().add_favorite}" title="${favorites.has(p.id) ? t().remove_favorite : t().add_favorite}">${favorites.has(p.id) ? "♥" : "♡"}${favorites.has(p.id) && hasFavChanged(p) ? `<span class="fav-changed-dot"></span>` : ""}</button>
    </div>
    <div class="card-body">
      <div class="card-brand-row">
        ${p.brand ? `<button class="card-brand" data-brand-jump="${p.brand}">${p.brand}</button>` : ""}
        ${p.category ? `<span class="category-badge cat-${p.category}">${categoryLabel(p.category)}</span>` : ""}
      </div>
      ${expanded ? `<h3>${pname(p)}</h3>` : `<h3><button class="card-title-btn" data-open-modal="${p.id}">${pname(p)}</button></h3>`}
      ${pname_alt(p) ? `<div class="name-alt">${pname_alt(p)}</div>` : ""}
      ${dupeMatches.length ? `<div class="dupe-of">${t().dupe_of}: ${dupeMatches.map(d => d.match ? `<button data-jump="${d.match.id}">${d.name}</button>` : d.name).join(", ")}</div>` : ""}
      ${dupedBy.length ? `<div class="duped-by">${t().duped_by}: ${dupedBy.map(o => `<button data-jump="${o.id}">${pname(o)}</button>`).join(", ")}</div>` : ""}
      ${p.accords && p.accords.length ? (expanded
        ? `<div class="accords expanded">${renderAccordsHTML(p)}</div>`
        : `<div class="accords" id="accords-${p.id}" data-pid="${p.id}"></div>
           <button class="accords-toggle" data-target="accords-${p.id}" data-pid="${p.id}" data-more="${p.accords.length}">${t().show_more_notes.replace("{n}", p.accords.length)}</button>`
      ) : ""}
      <div class="stores-list${expanded ? " expanded" : ""}"${expanded ? "" : ` id="stores-${p.id}" data-pid="${p.id}"`}>
        ${bestOffers ? renderBestOffersHTML(p, bestOffers) : renderStoresHTML(p, expanded ? sortedStores : sortedStores.slice(0,1))}
      </div>
      ${!bestOfferOnly && !expanded && sortedStores.length>1 ? `<button class="stores-toggle" data-target="stores-${p.id}" data-pid="${p.id}" data-more="${sortedStores.length-1}">${t().show_more_stores.replace("{n}", sortedStores.length-1)}</button>` : ""}
    </div>`;
  return card;
}

function appendCards(items){
  items.forEach(p => grid.appendChild(buildCardEl(p)));
}

function updateLoadSentinel(){
  document.getElementById("loadSentinel").hidden = renderedCount >= currentItems.length;
}

function renderItems(items, count){
  currentItems = items;
  renderedCount = Math.min(count, items.length);
  grid.innerHTML = items.length ? "" : `<p class="empty">${t().no_results}</p>`;
  appendCards(items.slice(0, renderedCount));
  updateLoadSentinel();
}

function loadMore(){
  if(renderedCount >= currentItems.length) return;
  const next = currentItems.slice(renderedCount, renderedCount + PAGE_SIZE);
  appendCards(next);
  renderedCount += next.length;
  updateLoadSentinel();
}

function render(){
  renderItems(computeItems(), PAGE_SIZE);
}

function filterByBrand(brand){
  captureScrollState();
  resetFilters();
  brandFilter = brand.trim().toLowerCase();
  document.getElementById("brandFilter").value = brandFilter;
  // resetFilters() already refreshed the panels, but against
  // brandFilter="all" -- it runs before the real brand is set two lines
  // up, so it needs to happen again now the actual filter is in place.
  refreshFilterPanels();
  updateFilterBadge();
  render();
  syncURLState();
  window.scrollTo({top: 0, behavior: "smooth"});
}

// Shared by the grid (#grid) and the product detail modal (#productModal)
// so every interactive bit inside a card — image zoom, share, store-link
// tracking, brand filter, dupe/title jumps, note/store expand — behaves
// identically no matter which of the two it's rendered into.
async function handleCardAreaClick(e){
  const img = e.target.closest(".card-img img, .store-thumb");
  if (img){ openLightbox(img.src, img.alt); trackEvent("product_image_view", { item_id: img.dataset.pid || "" }); return; }
  const shareBtn = e.target.closest("[data-share]");
  if (shareBtn){
    const url = `${location.origin}${location.pathname}#${shareBtn.dataset.share}`;
    trackEvent("share_link_click", { item_id: shareBtn.dataset.share });
    try{
      await navigator.clipboard.writeText(url);
      toast(t().link_copied);
    }catch{
      toast(t().copy_failed);
    }
    return;
  }
  const favBtn = e.target.closest("[data-fav]");
  if (favBtn){
    const id = favBtn.dataset.fav;
    const p = byId[id];
    if (favorites.has(id)){
      favorites.delete(id);
      delete favSnapshots[id];
    } else if (p){
      favorites.add(id);
      favSnapshots[id] = favSnapshotFor(p);
    }
    saveFavorites();
    saveFavSnapshots();
    trackEvent("favorite_toggle", { item_id: id, favorited: favorites.has(id) });
    updateFavoritesLabel();
    render();
    // favorites aren't part of PRODUCTS, so a plain render() (grid-only)
    // leaves an already-open modal showing a stale heart/dot — refresh it
    // in place when the toggle was clicked from inside the modal itself.
    if (productModal.classList.contains("open") && productModalBody.querySelector("[data-fav]")?.dataset.fav === id){
      openProductModal(id, {fromHistory:true});
    }
    return;
  }
  const listingBtn = e.target.closest("[data-listing-click]");
  if (listingBtn){ trackEvent("store_listing_click", { store: listingBtn.dataset.listingClick, item_id: listingBtn.dataset.pid || "" }); }
  const storeBtn = e.target.closest("[data-store-click]");
  if (storeBtn && !listingBtn){ trackEvent("store_home_click", { store: storeBtn.dataset.storeClick, item_id: storeBtn.dataset.pid || "" }); }
  const brandBtn = e.target.closest("[data-brand-jump]");
  if (brandBtn){ trackEvent("brand_jump_click", { brand: brandBtn.dataset.brandJump }); closeProductModal(); filterByBrand(brandBtn.dataset.brandJump); return; }
  const openBtn = e.target.closest("[data-open-modal]");
  if (openBtn){ trackEvent("product_title_click", { item_id: openBtn.dataset.openModal }); openProductModal(openBtn.dataset.openModal); return; }
  const jumpBtn = e.target.closest("[data-jump]");
  if (jumpBtn){ trackEvent("dupe_jump_click", { item_id: jumpBtn.dataset.jump }); openProductModal(jumpBtn.dataset.jump); return; }
  const accordsToggle = e.target.closest(".accords-toggle");
  if (accordsToggle){
    const target = document.getElementById(accordsToggle.dataset.target);
    const expanded = target.classList.toggle("expanded");
    // content isn't rendered until the first expand — see buildCardEl
    if (expanded && !target.dataset.loaded){
      target.innerHTML = renderAccordsHTML(byId[accordsToggle.dataset.pid]);
      target.dataset.loaded = "1";
    }
    accordsToggle.textContent = expanded ? t().show_less_notes : t().show_more_notes.replace("{n}", accordsToggle.dataset.more);
    if (expanded) trackEvent("accords_expand_click", { item_id: accordsToggle.dataset.target });
    return;
  }
  const storesToggle = e.target.closest(".stores-toggle");
  if (storesToggle){
    const target = document.getElementById(storesToggle.dataset.target);
    const expanded = target.classList.toggle("expanded");
    // only the cheapest store is rendered up front — the rest gets
    // appended (not replacing what's already shown) on first expand
    if (expanded && !target.dataset.loaded){
      const p = byId[storesToggle.dataset.pid];
      const sortedStores = sortedStoresFor(p);
      target.insertAdjacentHTML("beforeend", renderStoresHTML(p, sortedStores.slice(1)));
      target.dataset.loaded = "1";
    }
    storesToggle.textContent = expanded ? t().show_less_stores : t().show_more_stores.replace("{n}", storesToggle.dataset.more);
    if (expanded) trackEvent("stores_expand_click", { item_id: storesToggle.dataset.target });
    return;
  }
  const offerBtn = e.target.closest(".offer-btn");
  if (offerBtn){
    addToCart(offerBtn.dataset.pid, +offerBtn.dataset.si, +offerBtn.dataset.oi);
  }
}
grid.addEventListener("click", handleCardAreaClick);

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");
function openLightbox(src, alt){
  lightboxImg.src = src;
  lightboxImg.alt = alt || "";
  lightbox.classList.add("open");
}
function closeLightbox(){
  lightbox.classList.remove("open");
  lightboxImg.src = "";
}
lightbox.addEventListener("click", e => { if(e.target === lightbox) closeLightbox(); });
document.getElementById("lightboxClose").addEventListener("click", closeLightbox);

const productModalOverlay = document.getElementById("productModalOverlay");
const productModal = document.getElementById("productModal");
const productModalBody = document.getElementById("productModalBody");
productModal.addEventListener("click", e => {
  // #productModal is a full-viewport flex container centering the panel,
  // stacked above #productModalOverlay -- so it's the element that
  // actually receives a "click outside the panel" click, not the overlay
  // beneath it (the overlay is a pure dim-visual layer only). Only close
  // when the click lands on this container itself, not on the panel or
  // anything inside it.
  if (e.target === productModal) { closeProductModal(); return; }
  handleCardAreaClick(e);
});

// --- filter/search/pagination state <-> URL, so the back button undoes a
// filter/search/brand-jump change instead of landing on whatever the last
// modal open/close happened to be (the bug: filter changes used to never
// touch history at all, so "back" always fell through to the nearest
// actual pushState, which was almost always a stale product modal). Query
// params carry the shareable/restorable part of the state; history.state
// (not the URL) carries the ephemeral scroll/pagination depth, restored
// manually since scrollRestoration is "manual" (see top of script).
function paramsFromState(){
  const p = new URLSearchParams();
  if(kindFilter.size) p.set("kind", [...kindFilter].join(","));
  if(sizeFilter !== "all") p.set("size", sizeFilter);
  if(storeFilters.size) p.set("store", [...storeFilters].join(","));
  if(categoryFilter.size) p.set("cat", [...categoryFilter].join(","));
  if(brandFilter !== "all") p.set("brand", brandFilter);
  if(sortOrder !== "newest") p.set("sort", sortOrder);
  if(query.trim()) p.set("q", query.trim());
  if(inStockOnly) p.set("stock", "1");
  if(bestOfferOnly) p.set("best", "1");
  if(favoritesOnly) p.set("fav", "1");
  if(priceMin != null) p.set("min", priceMin);
  if(priceMax != null) p.set("max", priceMax);
  return p;
}
function applyParamsToState(params){
  kindFilter = new Set((params.get("kind")||"").split(",").filter(Boolean));
  sizeFilter = params.get("size") || "all";
  storeFilters = new Set((params.get("store")||"").split(",").filter(Boolean));
  categoryFilter = new Set((params.get("cat")||"").split(",").filter(Boolean));
  brandFilter = params.get("brand") || "all";
  sortOrder = params.get("sort") || "newest";
  query = params.get("q") || "";
  inStockOnly = params.get("stock") === "1";
  bestOfferOnly = params.get("best") === "1";
  favoritesOnly = params.get("fav") === "1";
  priceMin = parsePriceInput(params.get("min"));
  priceMax = parsePriceInput(params.get("max"));
}
// reflect state variables (already set, e.g. by applyParamsToState) back
// onto the actual form controls + the button-list filters' active state
function syncControlsFromState(){
  document.getElementById("search").value = query;
  document.getElementById("priceMin").value = priceMin ?? "";
  document.getElementById("priceMax").value = priceMax ?? "";
  document.getElementById("inStockOnly").checked = inStockOnly;
  document.getElementById("bestOfferOnly").checked = bestOfferOnly;
  document.getElementById("favoritesOnly").checked = favoritesOnly;
  refreshFilterPanels();
  // populateBrandFilter() has a side effect: it reads the <select>'s
  // CURRENT (still-stale) DOM value and writes it back into brandFilter,
  // which would silently undo whatever applyParamsToState() just set --
  // save the wanted value first, then re-assert both the DOM and the
  // variable afterward so that side effect can't win.
  const wantedBrand = brandFilter;
  populateBrandFilter();
  document.getElementById("brandFilter").value = wantedBrand;
  brandFilter = wantedBrand;
  populateSortOrder();
  updateFilterBadge();
}
// stamps the CURRENT history entry with where the user actually is right
// now (how many pages loaded, current scroll position) — kept fresh
// continuously via the debounced scroll listener below, PLUS called
// explicitly at the very top of every filter-changing handler (before
// that handler's own render() call, which resets renderedCount for the
// new filter) since a click can land within the scroll listener's own
// debounce window, before it's had a chance to fire on its own. Capturing
// only from inside syncURLState() (called after render()) was tried first
// and was wrong: by then renderedCount already reflected the NEW filter,
// not the state actually being left behind.
function captureScrollState(){
  history.replaceState({ renderedCount, scrollY: window.scrollY }, "", location.href);
}
let scrollCaptureDebounce;
window.addEventListener("scroll", () => {
  clearTimeout(scrollCaptureDebounce);
  scrollCaptureDebounce = setTimeout(captureScrollState, 300);
}, { passive: true });

function syncURLState({push=true}={}){
  const qs = paramsFromState().toString();
  const url = location.pathname + (qs ? "?"+qs : "") + location.hash;
  if(push){
    history.pushState({ renderedCount, scrollY: 0 }, "", url);
  }else{
    history.replaceState({ renderedCount, scrollY: window.scrollY }, "", url);
  }
}
// restores however many pages were loaded, then the scroll position --
// order matters, since scrolling to a Y position only makes sense once
// the grid is already tall enough to contain it
function restorePaginationAndScroll(state){
  const savedCount = (state && state.renderedCount) || PAGE_SIZE;
  while(renderedCount < savedCount && renderedCount < currentItems.length) loadMore();
  const savedScrollY = (state && state.scrollY) || 0;
  requestAnimationFrame(() => window.scrollTo(0, savedScrollY));
}

// `body{overflow:hidden}` alone doesn't stop background touch-scroll on
// iOS/mobile WebKit -- the panel behind the dimmed overlay keeps
// scrolling under the user's finger even though the panel itself has
// its own overflow-y:auto (a long-standing WebKit quirk, not a bug in
// the panel's own scroll setup). Pinning body with position:fixed is
// the reliable cross-browser lock; modalScrollY remembers exactly where
// to put the page back on close, since removing position:fixed on its
// own doesn't reliably preserve scroll position either.
let modalScrollY = 0;
function openProductModal(id, {fromHistory=false}={}){
  const p = byId[id];
  if (!p) return;
  productModalBody.replaceChildren(buildCardEl(p, {expanded:true}));
  const alreadyOpen = productModal.classList.contains("open");
  if(!alreadyOpen){
    modalScrollY = window.scrollY;
  }
  productModalOverlay.classList.add("open");
  productModal.classList.add("open");
  if(!alreadyOpen){
    document.body.style.position = "fixed";
    document.body.style.top = `-${modalScrollY}px`;
    document.body.style.left = "0";
    document.body.style.right = "0";
  }
  trackEvent("product_modal_open", { item_id: id });
  if (!fromHistory) {
    captureScrollState(); // remember the grid state we're leaving behind
    history.pushState({ renderedCount, scrollY: modalScrollY }, "", location.pathname + location.search + "#" + id);
  }
}
function closeProductModal({skipHistory=false}={}){
  if (!productModal.classList.contains("open")) return;
  productModalOverlay.classList.remove("open");
  productModal.classList.remove("open");
  document.body.style.position = "";
  document.body.style.top = "";
  document.body.style.left = "";
  document.body.style.right = "";
  window.scrollTo(0, modalScrollY);
  if (!skipHistory) history.pushState({ renderedCount, scrollY: modalScrollY }, "", location.pathname + location.search);
}
document.getElementById("productModalClose").addEventListener("click", () => closeProductModal());
// keeps browser back/forward in sync with the modal AND with filter/search/
// sort/pagination state — including walking back through a chain of
// dupe_of/duped_by jumps one product at a time, since each jump pushes its
// own history entry (see openProductModal)
window.addEventListener("popstate", (e) => {
  applyParamsToState(new URLSearchParams(location.search));
  syncControlsFromState();
  render();
  restorePaginationAndScroll(e.state);

  const id = location.hash.slice(1);
  if (id && byId[id]) openProductModal(id, {fromHistory:true});
  else closeProductModal({skipHistory:true});
});

// Escape closes whichever of {lightbox, modal} is topmost — a photo
// zoomed from inside the modal closes on its own Escape press before a
// second press closes the modal itself.
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (lightbox.classList.contains("open")) { closeLightbox(); return; }
  closeProductModal();
});

const kindLabel = k => k==="decant" ? t().filter_decant : k==="full" ? t().filter_full : t().filter_leftover;

// A persistent summary of every active filter, shown right above the
// results grid rather than only inside the (scrollable, and on narrow
// screens closed-by-default) sidebar. Kind and Store are now
// independent multi-select facets that keep filtering the list even
// after you change some OTHER facet — without this, picking "Full
// bottle" and then switching stores silently keeps the kind
// restriction in place with no visible reminder why the list looks the
// way it does. Called from updateFilterBadge(), which already runs
// after every single filter-changing action in the app.
function renderActiveFiltersBar(){
  const bar = document.getElementById("activeFiltersBar");
  const chips = [];
  [...kindFilter].forEach(k => chips.push({type:"kind", value:k, label:`${t().label_kind}: ${kindLabel(k)}`}));
  if(sizeFilter!=="all") chips.push({type:"size", value:sizeFilter, label:`${t().label_size}: ${sizeFilter}ml`});
  [...storeFilters].forEach(s => chips.push({type:"store", value:s, label:`${t().label_store}: ${s}`}));
  [...categoryFilter].forEach(c => chips.push({type:"category", value:c, label:`${t().label_category}: ${categoryLabel(c)}`}));
  if(brandFilter!=="all"){
    const opt = document.querySelector(`#brandFilter option[value="${CSS.escape(brandFilter)}"]`);
    chips.push({type:"brand", value:brandFilter, label:`${t().label_brand}: ${opt ? opt.textContent : brandFilter}`});
  }
  if(inStockOnly) chips.push({type:"stock", value:"1", label:t().in_stock_only});
  if(bestOfferOnly) chips.push({type:"best", value:"1", label:t().best_offer_only});
  if(favoritesOnly) chips.push({type:"fav", value:"1", label:t().favorites_only});
  if(priceMin!=null || priceMax!=null) chips.push({type:"price", value:"price", label:`${t().label_price}: ${priceMin ?? "0"}–${priceMax ?? "∞"}`});

  bar.hidden = chips.length===0;
  bar.innerHTML = !chips.length ? "" : chips.map(c => `
    <button type="button" class="active-filter-chip" data-chip-type="${c.type}" data-chip-value="${c.value}">${c.label} <span class="x" aria-hidden="true">✕</span></button>
  `).join("") + `<button type="button" class="active-filters-clear" id="activeFiltersClearAll">${t().clear_filters_btn}</button>`;
}
document.getElementById("activeFiltersBar").addEventListener("click", e => {
  if(e.target.closest("#activeFiltersClearAll")){
    captureScrollState();
    resetFilters();
    render();
    syncURLState();
    trackEvent("clear_all_filters", { source:"active_filters_bar" });
    return;
  }
  const chip = e.target.closest(".active-filter-chip");
  if(!chip) return;
  captureScrollState();
  const { chipType, chipValue } = chip.dataset;
  if(chipType==="kind"){
    kindFilter.delete(chipValue);
    if(!kindFilter.has("decant")) sizeFilter = "all";
  }else if(chipType==="store"){
    storeFilters.delete(chipValue);
  }else if(chipType==="category"){
    categoryFilter.delete(chipValue);
  }else if(chipType==="size"){
    sizeFilter = "all";
  }else if(chipType==="brand"){
    brandFilter = "all";
    document.getElementById("brandFilter").value = "all";
  }else if(chipType==="stock"){
    inStockOnly = false;
    document.getElementById("inStockOnly").checked = false;
  }else if(chipType==="best"){
    bestOfferOnly = false;
    document.getElementById("bestOfferOnly").checked = false;
  }else if(chipType==="fav"){
    favoritesOnly = false;
    document.getElementById("favoritesOnly").checked = false;
  }else if(chipType==="price"){
    priceMin = null; priceMax = null;
    document.getElementById("priceMin").value = "";
    document.getElementById("priceMax").value = "";
  }
  // Every facet's own counts depend on every OTHER active filter (brand/
  // stock/price included -- not just kind vs. store), so removing any one
  // chip always refreshes all three panels rather than only the one the
  // chip belonged to. This was the same staleness bug fixed in the
  // sidebar's own row handlers, just missed here since this is a second,
  // separate code path that can trigger the exact same removal.
  refreshFilterPanels();
  updateFilterBadge();
  render();
  syncURLState();
  trackEvent("active_filter_chip_remove", { type: chipType, value: chipValue });
});
