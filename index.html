function addToCart(productId, storeIdx, offerIdx){
  const key = `${productId}|${storeIdx}|${offerIdx}`;
  const existing = cart.find(c=>c.key===key);
  if (existing) existing.qty++;
  else cart.push({key, productId, storeIdx, offerIdx, qty:1});
  toast(t().added);
  syncCart();

  const p = PRODUCTS.find(x=>x.id===productId);
  const s = p && (p.stores||[])[storeIdx];
  const o = s && (s.offers||[])[offerIdx];
  if(p && s && o){
    trackEvent("add_to_cart", {
      currency: "EGP",
      value: o.price,
      items: [{ item_id: p.id, item_name: p.name_en || p.id, item_brand: p.brand || "", item_variant: `${s.name} / ${offerLabel(o)}`, price: o.price, quantity: 1 }],
    });
  }
}

/* Simple "best value" check: among all this product's offers of the same
   kind (decant/full/leftover) across every store, is there one with a
   lower price-per-ml? "as-shown" offers have no known quantity so they're
   excluded from the comparison — there's no fair per-ml basis for them. */
const offerPerMl = o => o.price / o.ml;
function findBestDeal(product, kind, ml){
  if(ml === "as-shown" || !ml) return null;
  let best = null;
  (product.stores||[]).forEach(s => {
    (s.offers||[]).forEach(o => {
      if(o.kind !== kind) return;
      if(o.sold_since) return; // never suggest switching to an offer that's itself sold out
      if(kind === "leftover"){
        // a leftover's ml is whatever happened to remain in an opened
        // bottle, not a chosen size — different stores' leftovers are
        // essentially never going to match exactly, so compare by
        // price-per-ml across ALL leftover offers instead of requiring
        // the same ml (unlike decants/full bottles, where a bigger size
        // being cheaper per ml is normal and not what this should flag).
        if(o.ml === "as-shown" || !o.ml) return;
      } else if(o.ml !== ml){
        return;
      }
      if(!best || offerPerMl(o) < offerPerMl(best.offer)) best = { store: s, offer: o };
    });
  });
  return best;
}

function resolveCartLine(c){
  const p = PRODUCTS.find(x=>x.id===c.productId);
  if(!p) return null;
  const s = (p.stores||[])[c.storeIdx];
  if(!s) return null;
  const o = (s.offers||[])[c.offerIdx];
  if(!o) return null;
  return { p, s, o };
}

/* Groups the flat `cart` array by store name, preserving each entry's real
   index into `cart` (needed for the inc/dec/remove buttons' data-* attrs,
   which operate on the flat array regardless of how it's displayed).

   Groups are sorted alphabetically by store name rather than left in
   "first occurrence in `cart`" order — with multiple stores in the cart,
   removing an item can change which store's entry happens to appear
   first in the flat array, which previously reordered every store block
   on screen (not just removed the one row) on every single removal. An
   alphabetical order is a pure function of the store names actually in
   the cart, so it's stable across add/remove and only ever changes when
   a store is added to or fully cleared from the cart. */
function groupCartByStore(){
  const groups = [];
  const byKey = {};
  cart.forEach((c,i) => {
    const line = resolveCartLine(c);
    if(!line) return;
    const key = (line.s.name||"").trim().toLowerCase() || "_";
    if(!byKey[key]){ byKey[key] = { name: line.s.name, entries: [] }; groups.push(byKey[key]); }
    byKey[key].entries.push({ c, i, line });
  });
  groups.sort((a,b) => a.name.localeCompare(b.name, undefined, {sensitivity:"base"}));
  return groups;
}

function syncCart(){
  // drop entries that no longer resolve (e.g. a catalog sync removed/reordered
  // a store's offers) so a stale localStorage cart never shows a count that
  // doesn't match what's actually displayed
  if(PRODUCTS.length) cart = cart.filter(c => resolveCartLine(c) !== null);
  saveCart();
  document.getElementById("cartCount").textContent = cart.reduce((a,c)=>a+c.qty,0);
  cartBody.innerHTML = "";
  const groups = groupCartByStore();
  if(!groups.length){
    cartBody.innerHTML = `<p class="empty">${t().empty}</p>`;
  }
  groups.forEach(g => {
    // sold-out lines stay visible (with a Sold badge, see below) so the
    // cart doesn't just silently lose an item, but they're worth 0 in
    // every total/message — you can't actually buy them anymore.
    const storeTotal = g.entries.reduce((a,{c,line})=>a + (line.o.sold_since ? 0 : line.o.price*c.qty), 0);
    const action = storeActionLink(g);
    const storeLink = storeBaseLink(g);
    const actionLabel = action ? (action.kind==="facebook" ? t().go_store_btn_facebook : (action.specific ? t().go_store_btn : t().go_store_website)) : "";
    const actionTitle = action ? (action.kind==="facebook" ? t().go_store_facebook : (action.specific ? t().go_store_btn : t().go_store_website)) : "";
    const head = document.createElement("div");
    head.className = "cart-store-head";
    head.innerHTML = `
      <bdi class="cart-store-name">${storeLink ? `<a href="${storeLink}" target="_blank" rel="noopener" data-store-name-link="${g.name}">${g.name}</a>` : g.name}</bdi>
      <span class="cart-store-total">${storeTotal}</span>
      ${action ? `<a class="cart-store-go" href="${action.href}" target="_blank" rel="noopener" data-go-store="${g.name}" data-go-kind="${action.kind}" data-go-specific="${action.specific ? 1 : 0}" title="${actionTitle}">${actionLabel}</a>` : ""}
      <button class="cart-store-copy" data-store="${g.name}">${t().copy_store_btn}</button>
      <button class="cart-store-clear" data-clear-store="${g.name}">${t().clear_store_btn}</button>`;
    cartBody.appendChild(head);
    g.entries.forEach(({c,i,line}) => {
      const { p, s, o } = line;
      let tip = "";
      // never suggest a "better deal" for a sold-out line, and never
      // let findBestDeal (which already skips sold offers) surface one
      // that's actually the same sold-out offer being compared to itself
      if(!o.sold_since){
        const best = findBestDeal(p, o.kind, o.ml);
        const isBetter = best && (o.kind === "leftover" ? offerPerMl(best.offer) < offerPerMl(o) : best.offer.price < o.price);
        if(isBetter){
          // the store name is always Latin-script (English seller names), so in
          // an Arabic (RTL) line it needs a bidi isolate around it — otherwise
          // the browser's bidi algorithm can pull neighboring dashes/numbers
          // out of their intended order. "من" ("from") also reads naturally in
          // Arabic where English just uses the store name directly.
          tip = `<div class="cart-tip">💡 ${t().better_deal} ${t().from_store}<bdi>${best.store.name}</bdi> - ${offerLabel(best.offer)} - ${best.offer.price}</div>`;
        }
      }
      const plink = productLineLink(s);
      const row = document.createElement("div");
      row.className = "cart-item";
      row.innerHTML = `
        ${p.image ? `<img class="cart-thumb" src="${p.image}" alt="">` : ""}
        <div class="info">
          <b>${plink ? `<a href="${plink}" target="_blank" rel="noopener" data-listing-click="${s.name}" data-pid="${p.id}">${pname(p)}</a>` : pname(p)}</b>
          ${o.sold_since ? `<span class="sold-badge">${t().sold_badge}</span>` : ""}
          ${offerLabel(o)} × ${o.price}
          <div class="store">${s.name}</div>
          ${tip}
          <button class="remove" data-rm="${i}">${t().remove}</button>
        </div>
        <div class="qty">
          <button data-dec="${i}" aria-label="decrease">−</button>
          <span>${c.qty}</span>
          <button data-inc="${i}" aria-label="increase"${o.sold_since ? ` disabled aria-disabled="true"` : ""}>+</button>
        </div>`;
      cartBody.appendChild(row);
    });
  });
  document.getElementById("total").textContent = cart.reduce((a,c)=>{
    const line = resolveCartLine(c);
    return a + (line && !line.o.sold_since ? line.o.price*c.qty : 0);
  }, 0);
}

cartBody.addEventListener("click", async e=>{
  const nameLink = e.target.closest("[data-store-name-link]");
  if(nameLink) trackEvent("cart_store_name_click", { store: nameLink.dataset.storeNameLink });
  const listingLink = e.target.closest("[data-listing-click]");
  if(listingLink) trackEvent("cart_item_listing_click", { store: listingLink.dataset.listingClick, item_id: listingLink.dataset.pid || "" });
  const inc=e.target.dataset.inc, dec=e.target.dataset.dec, rm=e.target.dataset.rm;
  if(inc!=null || dec!=null || rm!=null){
    if(inc!=null){ cart[inc].qty++; trackEvent("cart_qty_increase", { item_id: cart[inc].productId }); }
    if(dec!=null){ const pid=cart[dec].productId; cart[dec].qty--; if(cart[dec].qty<1) cart.splice(dec,1); trackEvent("cart_qty_decrease", { item_id: pid }); }
    if(rm!=null){ trackEvent("remove_from_cart", { item_id: cart[rm].productId }); cart.splice(rm,1); }
    syncCart();
    return;
  }
  const storeGoBtn = e.target.closest(".cart-store-go");
  if(storeGoBtn){
    const goKind = storeGoBtn.dataset.goKind, goSpecific = storeGoBtn.dataset.goSpecific === "1";
    trackEvent("cart_store_go", { store: storeGoBtn.dataset.goStore, kind: goKind, specific: goSpecific });
    // "specific" means this is a real, direct link to the exact product
    // page -- a normal, working navigation that needs no explanation.
    // Everything else (a Facebook chat that may or may not keep its
    // pre-filled text, or a store's homepage with nothing pre-added) is
    // really just "copy the list and take your best shot," so it also
    // copies the plain item list to the clipboard and says so, instead
    // of silently implying the click did more than it did.
    if(!goSpecific){
      try{
        await navigator.clipboard.writeText(buildMessage(storeGoBtn.dataset.goStore, {plain:true}));
        toast(goKind === "facebook" ? t().order_hint_facebook : t().order_hint_website);
      }catch{}
    }
    // real <a target="_blank"> link -- let it navigate natively too
  }
  const storeCopyBtn = e.target.closest(".cart-store-copy");
  if(storeCopyBtn){
    trackEvent("copy_store_message", { store: storeCopyBtn.dataset.store });
    try{
      await navigator.clipboard.writeText(buildMessage(storeCopyBtn.dataset.store));
      toast(t().copied);
    }catch{
      toast(t().copy_failed);
    }
    return;
  }
  const storeClearBtn = e.target.closest(".cart-store-clear");
  if(storeClearBtn){
    const target = storeClearBtn.dataset.clearStore;
    trackEvent("cart_store_clear", { store: target });
    cart = cart.filter(c => {
      const line = resolveCartLine(c);
      return line ? line.s.name !== target : true;
    });
    syncCart();
    toast(t().cleared);
  }
});

document.getElementById("clearCart").onclick = ()=>{
  if(!cart.length) return;
  trackEvent("cart_clear_all", { item_count: cart.length });
  cart = [];
  syncCart();
  toast(t().cleared);
};

function isFacebookUrl(url){
  return !!url && url.includes("facebook.com");
}

// The store name's own link (top of each cart group) -- a plain link to
// wherever the store lives, separate from the smarter "Order" action
// below.
function storeBaseLink(g){
  const first = g.entries[0].line.s;
  return first.url || first.product_url || null;
}

// A cart line's product name links straight to its own listing only when
// that listing is a real website page -- a Facebook post/profile isn't a
// product page, so it stays plain text there instead of implying a link
// that just goes back to the same seller's timeline.
function productLineLink(s){
  const url = s.product_url || s.url;
  return url && !isFacebookUrl(url) ? url : null;
}

// A profile.php numeric id, a groups/<gid>/user/<uid> id (this does
// carry the person's real, global Facebook user id -- it's just a
// group-scoped view of their profile, not a scoped id), or a plain
// profile/page username all work with Messenger's m.me click-to-chat
// links. A group POST link (facebook.com/groups/<gid>/posts/<pid>)
// doesn't encode a person at all and is skipped. Whichever of the
// store's two URLs (general "url" vs per-offer "product_url") actually
// resolves to a real id wins.
function extractFacebookId(url){
  if(!url) return null;
  let m = url.match(/facebook\.com\/profile\.php\?id=(\d+)/);
  if(m) return m[1];
  m = url.match(/facebook\.com\/groups\/\d+\/user\/(\d+)/);
  if(m) return m[1];
  m = url.match(/facebook\.com\/([^\/?#]+)/);
  if(m && !["groups","people","pages"].includes(m[1])) return m[1];
  return null;
}

// The action a store's cart-group header "Order" link should take. A
// real, directly-shoppable product page always wins when the group is a
// single product -- more reliable than routing through Facebook even for
// a seller whose general profile happens to be on Facebook (some sellers
// list on both, e.g. a Facebook-first seller who also runs a real
// storefront). Otherwise, a Facebook seller gets a click-to-chat
// Messenger link with that store's order lines pre-typed into the
// compose box (unsent) -- though Facebook's own client doesn't always
// honor the pre-filled text, so cartBody's click handler also copies the
// same text to the clipboard as a fallback. A real store with more than
// one distinct product in the group falls back to its homepage, since
// there's no way to deep-link "several different pre-added items" into
// a site we don't control.
// `specific` marks the one case that's a genuine, working "order" action --
// a direct link to a real product page -- as opposed to every other case,
// which is really just "copy the list and take your best shot" (a
// Messenger chat that may or may not keep the pre-filled text, or a
// store's homepage with nothing pre-added). The UI uses this to label
// and explain the button honestly instead of implying it always works.
function storeActionLink(g){
  const first = g.entries[0].line.s;
  const distinctProducts = new Set(g.entries.map(({line}) => line.p.id));
  const realProductUrl = first.product_url && !isFacebookUrl(first.product_url) ? first.product_url : null;
  if(realProductUrl && distinctProducts.size === 1) return { href: realProductUrl, kind:"website", specific:true };

  const url = first.url || first.product_url;
  if(!url) return null;
  if(isFacebookUrl(url) || isFacebookUrl(first.product_url||"")){
    const fbId = extractFacebookId(first.url) || extractFacebookId(first.product_url);
    const href = fbId
      ? `https://m.me/${fbId}?text=${encodeURIComponent(buildMessage(g.name, {plain:true}))}`
      : (first.url || first.product_url);
    return { href, kind:"facebook", specific:false };
  }
  return { href: url, kind:"website", specific:false };
}

/* With no filter, the full cart grouped by store (grand total appended,
   each group headed by its store name). With filterStoreName, just that
   one store's lines. Plain mode (only meaningful together with
   filterStoreName) drops the store-name header/footer entirely and
   just labels the one total "total:" -- used for the per-store "Order"
   action, since that message is already headed for one specific,
   already-identified destination (that seller's own chat), so repeating
   their own name back to them is redundant. */
function buildMessage(filterStoreName, {plain=false}={}){
  // Always built in English regardless of the current UI language — a
  // message meant to be pasted into WhatsApp/Messenger/a seller's DMs
  // mixing Arabic product names/tags with Latin digits and prices came
  // out visually reordered once pasted somewhere that doesn't carry the
  // same bidi context the page had, since plain-text copy/paste has no
  // direction markup of its own. English-only text plus plain digits
  // never has that problem, so the seller-facing message stays this way
  // no matter which language the page itself is being browsed in.
  const groups = groupCartByStore().filter(g => !filterStoreName || g.name === filterStoreName);

  let msg = "";
  let grand = 0;
  groups.forEach(g=>{
    // never send a seller a line for something that's since sold out —
    // it's still shown on-screen (with a Sold badge) so it doesn't just
    // vanish from the cart, but it has no business in the order message
    const purchasable = g.entries.filter(({line}) => !line.o.sold_since);
    if(!purchasable.length) return;
    const total = purchasable.reduce((a,{c,line})=>a + line.o.price*c.qty, 0);
    const lines = purchasable.map(({c,line}) => {
      const { p, o } = line;
      const lineTotal = o.price * c.qty;
      const qtyTag = c.qty > 1 ? ` × ${c.qty}` : "";
      const fullName = p.brand ? `${p.brand} ${pname(p, "en")}` : pname(p, "en");
      return `${fullName} - ${offerLabel(o, "en")}${qtyTag} - ${lineTotal}`;
    });
    msg += plain
      ? `${lines.join("\n")}\n${I18N.en.total}: ${total}\n\n`
      : `${g.name}:\n${lines.join("\n")}\n${g.name} ${I18N.en.store_total}: ${total}\n\n`;
    grand += total;
  });
  if(!plain && !filterStoreName) msg += `${I18N.en.total}: ${grand}`;
  return msg.trim();
}

document.getElementById("copyMsg").onclick = async ()=>{
  if(!cart.length){ toast(t().empty); return; }
  trackEvent("begin_checkout", { currency: "EGP", item_count: cart.length });
  try{
    await navigator.clipboard.writeText(buildMessage());
    toast(t().copied);
  }catch{
    toast(t().copy_failed);
  }
};

let toastTimer;
function toast(txt){
  const el = document.getElementById("toast");
  el.textContent = txt;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}

// fires loadMore() a bit before the sentinel actually enters the
// viewport (rootMargin) so the next page is ready before the user hits
// the bottom, rather than a visible pause-then-append.
new IntersectionObserver(entries => {
  if(entries[0].isIntersecting) loadMore();
}, { rootMargin: "600px" }).observe(document.getElementById("loadSentinel"));

load();
syncCart();
</script>
</body>
</html>
